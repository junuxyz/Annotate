version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    open-pull-requests-limit: 1
    ignore:
      # Obsidian pins these peer dependencies. Update them together with obsidian.
      - dependency-name: '@codemirror/state'
      - dependency-name: '@codemirror/view'
      # Review major upgrades manually instead of opening individual bot PRs.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
