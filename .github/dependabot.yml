version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Keep types aligned with the oldest supported Node runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint currently supports TypeScript <6.1, not TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7.0.0 <8.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
