name: Pre-tag E2E
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to validate before creating the version tag
        required: true
concurrency:
  group: pre-tag-e2e-${{ inputs.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Require the exact commit SHA before tag validation
        env:
          RELEASE_COMMIT: ${{ inputs.ref }}
        run: test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Prepare pinned Obsidian in the disposable runner
        run: node e2e/macos/provision-ci.mjs
      - name: Build and validate native offscreen Obsidian
        run: npm run check:release
      - name: Record the validated distribution and commit
        run: |
          npm run release:verify --silent > e2e/evidence/validated-build.json
          git rev-parse HEAD > e2e/evidence/validated-commit.txt
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obsidian-e2e-evidence
          path: |
            e2e/evidence/
            !e2e/evidence/native-cache/**
          if-no-files-found: warn
